; PlatformIO project (optional route: VS Code + Wokwi extension, Annex F.6)
; Arduino-ESP32 core pinned to 2.0.x for library compatibility (Edge Impulse
; docs recommend 2.0.4; PubSubClient/ArduinoJson are compatible with 2.0.x).
[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
;   -DREPLAY_TEST        ; uncomment to build the X1 accuracy replay
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.0.4
